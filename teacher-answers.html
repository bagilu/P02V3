<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教師端 回答區</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4 page-wrap">
    <div class="row justify-content-center">
      <div class="col-lg-11">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h1 class="h3 mb-1">教師端 回答區</h1>
            <p class="text-muted mb-0">查看指定問題的回答狀況</p>
          </div>
          <div class="d-flex gap-2">
            <button id="btnToggleNickname" class="btn btn-outline-secondary">顯示暱稱</button>
            <button id="btnBackToQuestions" class="btn btn-outline-secondary">回標題區</button>
          </div>
        </div>

        <div class="card shadow-sm mb-4">
          <div class="card-body p-4">
            <div class="row g-3 mb-3">
              <div class="col-md-6 col-lg-3">
                <div class="info-box">
                  <div class="info-label">討論區編號</div>
                  <div id="discussionCode" class="info-value">----</div>
                </div>
              </div>
              <div class="col-md-6 col-lg-3">
                <div class="info-box">
                  <div class="info-label">目前加入人數</div>
                  <div id="participantCount" class="info-value">0</div>
                </div>
              </div>
            </div>
            <div>
              <div class="fw-semibold mb-2">問題內容</div>
              <div id="questionText" class="question-card">載入中...</div>
            </div>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-3">
              <div>
                <h2 class="h5 mb-1">回答列表</h2>
                <small id="answerCountText" class="text-muted">載入回答中...</small>
              </div>
              <div class="d-flex align-items-center gap-3 flex-wrap">
                <small id="nicknameStatusText" class="text-muted">目前預設隱藏暱稱</small>
                <div class="btn-group btn-group-sm" role="group" aria-label="回答檢視方式">
                  <button id="btnStickyView" type="button" class="btn btn-primary" aria-pressed="true">便利貼</button>
                  <button id="btnTableView" type="button" class="btn btn-outline-secondary" aria-pressed="false">表格</button>
                  <button id="btnAffinityView" type="button" class="btn btn-outline-secondary" aria-pressed="false">分類</button>
                </div>
              </div>
            </div>

            <div id="stickyView" aria-live="polite">
              <div id="stickyNotesGrid" class="sticky-notes-grid"></div>
            </div>

            <div id="tableView" class="table-responsive" hidden>
              <table class="table table-bordered table-striped align-middle">
                <thead class="table-light">
                  <tr>
                    <th style="width: 18%;">暱稱</th>
                    <th style="width: 18%;">時間</th>
                    <th>內容</th>
                  </tr>
                </thead>
                <tbody id="answersTableBody"></tbody>
              </table>
            </div>

            <div id="affinityView" hidden>
              <div class="affinity-toolbar d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <div>
                  <button id="btnAddCategory" type="button" class="btn btn-success btn-sm">＋ 新增分類</button>
                  <button id="btnRefreshAffinity" type="button" class="btn btn-outline-secondary btn-sm">重新整理回答</button>
                </div>
                <small id="affinitySaveStatus" class="text-muted" aria-live="polite">所有變更會自動保存</small>
              </div>
              <div id="affinityBoard" class="affinity-board" aria-live="polite"></div>
            </div>
            <div id="answersMessage" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./assets/js/teacher-answers.js"></script>
</body>
</html>
