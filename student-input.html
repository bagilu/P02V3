<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>學生回答 / Student Response</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="./assets/css/style.css" rel="stylesheet"></head>
<body><div class="container py-4 page-wrap"><div class="row justify-content-center"><div class="col-lg-8">
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"><div><h1 class="h3 mb-1">學生回答 / Student Response</h1><p class="text-muted mb-0">請回答目前作用中的問題 / Respond to the active question</p></div><button id="btnLeaveDiscussionTop" class="btn btn-outline-secondary" hidden>離開討論 / Leave</button></div>
<div id="joinPanel" class="card shadow-sm mb-4" hidden><div class="card-body p-4"><h2 class="h5 mb-3">加入討論 / Join Discussion</h2><div class="mb-3"><div class="form-label">討論代碼 / Join Code</div><div id="directJoinCode" class="join-code-display">----</div></div><div class="mb-3"><label for="nickname" class="form-label">暱稱 / Nickname</label><input type="text" id="nickname" class="form-control" maxlength="50" placeholder="請輸入暱稱 / Enter a nickname"></div><button id="btnJoinDiscussion" class="btn btn-success btn-lg">加入討論 / Join</button><div id="joinMessage" class="mt-3"></div></div></div>
<div id="studentMain" hidden>
<div class="card shadow-sm mb-4"><div class="card-body p-4"><div class="row g-3"><div class="col-md-6"><div class="info-box"><div class="info-label">討論代碼 / Join Code</div><div id="discussionCode" class="info-value code-badge">----</div></div></div><div class="col-md-6"><div class="info-box"><div class="info-label">目前加入人數 / Participants</div><div id="participantCount" class="info-value">0</div></div></div></div></div></div>
<div class="card shadow-sm mb-4"><div class="card-body p-4"><div class="mb-2 fw-semibold">目前問題 / Active Question</div><div id="activeQuestionText" class="question-card mb-4">載入中... / Loading...</div><div class="mb-3"><label for="answerContent" class="form-label">您的回答 / Your Response</label><textarea id="answerContent" class="form-control" rows="8" placeholder="請輸入回答內容 / Enter your response"></textarea></div><button id="btnSubmitAnswer" class="btn btn-primary btn-lg">送出 / Submit</button><div id="submitMessage" class="mt-3"></div></div></div>
<div class="card shadow-sm mb-4"><div class="card-body p-4"><div class="row align-items-center g-4"><div class="col-md-auto text-center"><div id="joinQrCode" class="qr-box"></div></div><div class="col"><h2 class="h6">邀請下一位同學 / Invite Another Student</h2><div class="join-code-display mb-2"><span id="shareJoinCode">----</span></div><a id="shareJoinUrl" class="share-url" target="_blank" rel="noopener"></a><div class="mt-3"><button id="btnCopyJoinUrl" class="btn btn-outline-primary btn-sm">複製網址 / Copy URL</button></div></div></div></div></div>
</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script type="module" src="./assets/js/student-input.js"></script></body></html>
